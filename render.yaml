# Render setup: New > Blueprint > pick this repo, or New > Web Service with the same settings.
services:
  - type: web
    name: tandrahub
    runtime: node
    plan: free               # sleeps after 15 min without visitors; first visit then takes ~1 minute
    buildCommand: npm install --omit=dev
    startCommand: node server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL      # Neon connection string (free, permanent). Without it nothing is kept.
        sync: false
      - key: STAFF_EMAIL
        value: admin@tandrahub.com
      - key: STAFF_PASSWORD    # Render generates one; read it under Environment
        generateValue: true
